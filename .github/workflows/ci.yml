name: CI

on:
  push:
    branches: [main, rust]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Kernel environment
        shell: bash
        run: |
          uv venv kenv --python 3.13
          uv pip install --python kenv ipykernel
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "NBLEAN_TEST_PYTHON=$GITHUB_WORKSPACE\\kenv\\Scripts\\python.exe" >> "$GITHUB_ENV"
          else
            echo "NBLEAN_TEST_PYTHON=$GITHUB_WORKSPACE/kenv/bin/python" >> "$GITHUB_ENV"
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        timeout-minutes: 10
