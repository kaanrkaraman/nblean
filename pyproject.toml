[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "nblean"
dynamic = ["version"]
description = "Token-lean Jupyter notebook access for coding agents: outlines, clipped outputs, images as files, a persistent kernel."
readme = "README.md"
authors = [{ name = "Recep Kaan Karaman", email = "kaanrkaraman@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["jupyter", "notebook", "ipynb", "llm", "coding-agent", "claude-code", "tokens", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/kaanrkaraman/nblean"
Repository = "https://github.com/kaanrkaraman/nblean"
Issues = "https://github.com/kaanrkaraman/nblean/issues"

[tool.maturin]
bindings = "bin"
strip = true
